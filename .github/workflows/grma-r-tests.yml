name: GRMA R regression

on:
  pull_request:
    paths:
      - 'R/grma_meta.R'
      - 'tests/test_grma_constant_features.R'
      - '.github/workflows/grma-r-tests.yml'
  push:
    branches: [main]
    paths:
      - 'R/grma_meta.R'
      - 'tests/test_grma_constant_features.R'
      - '.github/workflows/grma-r-tests.yml'

permissions:
  contents: read

jobs:
  grma-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("metafor", "testthat"), repos = getOption("repos"))'
      - name: Execute GRMA R regressions
        run: Rscript -e 'options(warn = 2); testthat::test_file("tests/test_grma_constant_features.R", reporter = testthat::StopReporter$new())'
